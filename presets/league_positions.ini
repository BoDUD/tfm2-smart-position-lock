; League of Legends champions (the "league" mod): their official main positions, the first one
; where the champion plays when its team has a choice.
; Built into Smart Position Lock 1.3.0 and later - nothing to copy. To change a champion, copy its
; line into the [positions] section of settings.ini in the mod folder and edit it there (or click
; its positions in the F7 panel): settings.ini wins over this list.
; 英雄联盟英雄（league Mod）的官方主位置，第一个是有得选时优先打的位置。
; 智能位置锁定 1.3.0 起已内置，不用复制。想改某个英雄：把它这一行复制到 Mod 文件夹 settings.ini 的
; [positions] 段再改（或者在 F7 面板里点它的位置），settings.ini 优先于这个列表。

